volumes:
  ifdd_be_postgres_data: { }
  ifdd_be_postgres_data_backups: { }

services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: {{cookiecutter.ifdd_registry_url}}/{{cookiecutter.ifdd_be_prj_slug}}:{{cookiecutter.ifdd_be_version}}
    env_file:
      - .env
    environment:
      - PORT=${IFDD_BE_PORT}
      - WORKERS=${MAX_WORKERS}
    networks:
      - ext-proxy-net
      - db-net
    expose:
      - ${IFDD_BE_PORT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data.rule=Host(`{{cookiecutter.ifdd_be_host}}`)"
      - "traefik.http.services.data.loadbalancer.server.port={{cookiecutter.ifdd_be_port}}"
      # Security headers from the proxy (ifdd-de/proxy, headers.yml). The
      # backend also serves Swagger UI and ReDoc (/docs, /redoc), so it uses
      # csp-api-docs: scripts and styles from this host only, plus the realm
      # in connect-src for "Authorize" (see README, "API documentation").
      - "traefik.http.routers.data.middlewares=security-headers@file,csp-api-docs@file"
      - "traefik.docker.network=proxy-net"
      {%- if cookiecutter.ifdd_be_enable_tls == "y" %}
      - "traefik.http.routers.data.entrypoints=websecure"
      - "traefik.http.routers.data.tls=true"
      {%- endif +%}
      {%- if cookiecutter.ifdd_be_enable_letsencrypt == "y" %}
      - "traefik.http.routers.data.tls.certresolver=letsencrypt"
      {%- endif +%}
    # prestart.sh creates missing tables before the server starts, so the
    # database must accept connections first.
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: "{{ cookiecutter.ifdd_be_postgres_image }}"
    env_file:
      - .env
    hostname: ${POSTGRES_HOST}
    volumes:
      # From PostgreSQL 18 on, the image keeps its data in a versioned
      # subdirectory of /var/lib/postgresql.
      - ifdd_be_postgres_data:/var/lib/postgresql
      - ifdd_be_postgres_data_backups:/backups
    networks:
      - db-net
    restart: always
    healthcheck:
      # -d: without it pg_isready connects to a database named like the user,
      # and PostgreSQL logs a failed attempt at every check.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
networks:
  ext-proxy-net:
    name: proxy-net
    external: true
  db-net:
    external: false
